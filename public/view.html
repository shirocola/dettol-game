<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ดาวน์โหลดรูปภาพ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }
        
        .image-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .main-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        
        .download-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(233, 30, 99, 0.9);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        
        .download-btn:hover {
            background: rgba(233, 30, 99, 1);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }
        
        .download-btn:active {
            transform: translateY(0);
        }
        
        /* Mobile optimized */
        @media (max-width: 768px) {
            .download-btn {
                bottom: 30px;
                right: 20px;
                padding: 14px 28px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img id="mainImage" class="main-image" alt="Downloaded Image">
        <button class="download-btn" onclick="downloadImage()">📥 ดาวน์โหลด</button>
    </div>

    <script>
        // Get parameters from URL
        const params = new URLSearchParams(window.location.search);
        const type = params.get('type');
        const file = params.get('file');
        
        if (type && file) {
            const filename = type + '-' + file + '.png';
            const imageUrl = '/' + filename;
            
            // Set the image source
            document.getElementById('mainImage').src = imageUrl;
            
            // Download function
            window.downloadImage = async function() {
                try {
                    const response = await fetch(imageUrl);
                    const blob = await response.blob();
                    const url = URL.createObjectURL(blob);
                    
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = filename;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    URL.revokeObjectURL(url);
                } catch (error) {
                    // Fallback - direct download
                    const link = document.createElement('a');
                    link.href = imageUrl;
                    link.download = filename;
                    link.click();
                }
            };
        } else {
            document.body.innerHTML = '<div style="color: white; text-align: center; padding: 20px;">ไม่พบรูปภาพ</div>';
        }
    </script>
</body>
</html>
