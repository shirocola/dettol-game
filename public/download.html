<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ดาวน์โหลดรูปภาพ - Dettol</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #e3f2fd, #f8bbd9);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #e91e63;
            margin-bottom: 20px;
        }
        .status {
            font-size: 18px;
            margin: 15px 0;
            padding: 10px;
            border-radius: 8px;
        }
        .downloading {
            background: #e3f2fd;
            color: #1976d2;
        }
        .completed {
            background: #e8f5e8;
            color: #2e7d32;
        }
        .error {
            background: #ffebee;
            color: #c62828;
        }
        .file-item {
            margin: 10px 0;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 5px;
        }
        .back-button {
            background: linear-gradient(135deg, #757575, #9e9e9e);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(117, 117, 117, 0.3);
            margin-top: 20px;
        }
        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(117, 117, 117, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 ดาวน์โหลดรูปภาพของคุณ</h1>
        <div id="status" class="status downloading">กำลังเตรียมไฟล์...</div>
        <div id="files"></div>
        <button class="back-button" onclick="goBackToMain()">กลับสู่หน้าหลัก</button>
    </div>

    <script>
        // Get parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const resultType = urlParams.get('type');
        
        if (!resultType) {
            document.getElementById('status').textContent = 'ไม่พบข้อมูลประเภทผลลัพธ์';
            document.getElementById('status').className = 'status error';
        } else {
            startDownload(resultType);
        }

        async function startDownload(type) {
            const statusEl = document.getElementById('status');
            const filesEl = document.getElementById('files');
            
            try {
                statusEl.textContent = 'กำลังดาวน์โหลด...';
                statusEl.className = 'status downloading';
                
                // Download result image
                filesEl.innerHTML += '<div class="file-item">📥 กำลังดาวน์โหลด: ' + type + '-result.png</div>';
                await downloadFile(`/${type}-result.png`, `${type}-result.png`);
                
                // Small delay between downloads
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // Download quote image
                filesEl.innerHTML += '<div class="file-item">📥 กำลังดาวน์โหลด: ' + type + '-quote.png</div>';
                await downloadFile(`/${type}-quote.png`, `${type}-quote.png`);
                
                statusEl.textContent = '✅ ดาวน์โหลดเสร็จสิ้น!';
                statusEl.className = 'status completed';
                filesEl.innerHTML += '<div class="file-item" style="color: green;">🎉 ดาวน์โหลดทั้ง 2 ไฟล์เสร็จสิ้น</div>';
                
            } catch (error) {
                console.error('Download error:', error);
                statusEl.textContent = 'เกิดข้อผิดพลาดในการดาวน์โหลด';
                statusEl.className = 'status error';
                filesEl.innerHTML += '<div class="file-item" style="color: red;">❌ เกิดข้อผิดพลาด: ' + error.message + '</div>';
            }
        }

        async function downloadFile(url, filename) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                
                const blob = await response.blob();
                const downloadUrl = URL.createObjectURL(blob);
                
                const link = document.createElement('a');
                link.href = downloadUrl;
                link.download = filename;
                link.style.display = 'none';
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                URL.revokeObjectURL(downloadUrl);
            } catch (error) {
                throw new Error(`ไม่สามารถดาวน์โหลด ${filename}: ${error.message}`);
            }
        }

        function goBackToMain() {
            // Get the base URL (remove /download.html?type=...)
            const baseUrl = window.location.origin;
            // Redirect to main game page
            window.location.href = baseUrl;
        }
    </script>
</body>
</html>
